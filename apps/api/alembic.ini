[alembic]
# Copper Atlas — Alembic Database Migration Configuration
# 全局铜矿床图谱 — 数据库迁移配置

script_location = alembic
prepend_sys_path = .

# Database URL (override via environment variable DATABASE_URL_SYNC)
sqlalchemy.url = postgresql://atlas:atlas_dev@localhost:5432/copper_atlas

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
