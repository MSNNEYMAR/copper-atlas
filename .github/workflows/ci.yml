# ============================================================================
# Copper Atlas — CI Pipeline
# Runs on every PR and push to main/develop.
# Steps: lint → typecheck → test (frontend + backend) → build
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "9"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # ==========================================================================
  # Frontend: Lint + Typecheck + Test + Build
  # ==========================================================================
  frontend:
    name: "Frontend (Next.js)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test -- --passWithNoTests --reporter=verbose

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_MARTIN_URL: http://localhost:3000

  # ==========================================================================
  # Backend: Lint + Typecheck + Test
  # ==========================================================================
  backend:
    name: "Backend (FastAPI)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: copper_atlas_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check src/ tests/

      - name: Type check (MyPy)
        run: mypy src/ --ignore-missing-imports || true  # Non-blocking during Phase 1

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL_SYNC: postgresql://atlas:atlas_test@localhost:5432/copper_atlas_test
          DATABASE_URL: postgresql+asyncpg://atlas:atlas_test@localhost:5432/copper_atlas_test

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=30
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://atlas:atlas_test@localhost:5432/copper_atlas_test
          DATABASE_URL_SYNC: postgresql://atlas:atlas_test@localhost:5432/copper_atlas_test
          DATABASE_URL: postgresql+asyncpg://atlas:atlas_test@localhost:5432/copper_atlas_test

  # ==========================================================================
  # Database: Migration Check
  # ==========================================================================
  database-check:
    name: "Database Migration Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: copper_atlas_migration_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install alembic
        run: pip install alembic sqlalchemy geoalchemy2 psycopg2-binary asyncpg

      - name: Apply migration (upgrade)
        run: alembic upgrade head
        env:
          DATABASE_URL_SYNC: postgresql://atlas:atlas_migration@localhost:5432/copper_atlas_migration_test

      - name: Verify migration (downgrade)
        run: alembic downgrade base
        env:
          DATABASE_URL_SYNC: postgresql://atlas:atlas_migration@localhost:5432/copper_atlas_migration_test

      - name: Re-apply migration (upgrade again)
        run: alembic upgrade head
        env:
          DATABASE_URL_SYNC: postgresql://atlas:atlas_migration@localhost:5432/copper_atlas_migration_test
