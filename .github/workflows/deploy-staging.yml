# ============================================================================
# Copper Atlas — Staging Deployment
# Deploys the develop branch to staging environment.
# Frontend → Vercel (automatic via Vercel Git integration)
# Backend → Railway (automatic via Railway Git integration)
# This workflow handles database migration and smoke tests post-deploy.
# ============================================================================

name: Deploy Staging

on:
  push:
    branches: [develop]

jobs:
  # Database migration (runs before deployment)
  migrate:
    name: "Run database migrations"
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install alembic
        run: pip install alembic sqlalchemy geoalchemy2 psycopg2-binary asyncpg

      - name: Run migrations
        run: cd apps/api && alembic upgrade head
        env:
          DATABASE_URL_SYNC: ${{ secrets.STAGING_DATABASE_URL }}

  # Smoke tests
  smoke-test:
    name: "Smoke tests"
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Health check API
        run: |
          curl -f ${{ secrets.STAGING_API_URL }}/health || exit 1

      - name: Check deposits endpoint
        run: |
          curl -f ${{ secrets.STAGING_API_URL }}/api/v1/deposits?size=1 || exit 1

      - name: Check statistics endpoint
        run: |
          curl -f ${{ secrets.STAGING_API_URL }}/api/v1/statistics/summary || exit 1
